<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="groupby と combine による条件別要約（Split-Apply-Combine）および leftjoin による参加者属性表の結合">
  <title>groupby と combine による条件別要約（Split-Apply-Combine）および leftjoin による参加者属性表の結合</title>
  <rect width="760" height="300" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="24" width="344" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="196" y="48" text-anchor="middle" fill="#2A2733" font-size="12.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">① groupby → combine（条件ごとの平均）</text>
  <rect x="40" y="66" width="128" height="72" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.6"/>
  <text x="104" y="86" text-anchor="middle" fill="#4682B4" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cond == "cong"</text>
  <text x="104" y="106" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512.5, 498.2, ...</text>
  <text x="104" y="124" text-anchor="middle" fill="#6E6879" font-size="9.5" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">(6試行)</text>
  <rect x="40" y="150" width="128" height="72" rx="7" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.6"/>
  <text x="104" y="170" text-anchor="middle" fill="#6D3E86" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cond == "incong"</text>
  <text x="104" y="190" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">560.4, 601.3, ...</text>
  <text x="104" y="208" text-anchor="middle" fill="#6E6879" font-size="9.5" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">(6試行)</text>
  <text x="196" y="144" text-anchor="middle" fill="#2A2733" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">combine ▶</text>
  <rect x="224" y="96" width="128" height="96" rx="8" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.8"/>
  <text x="288" y="118" text-anchor="middle" fill="#2B7A1E" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cond   | rt_mean</text>
  <text x="288" y="144" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cong   | 507.933</text>
  <text x="288" y="170" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">incong | 590.583</text>
  <text x="196" y="254" text-anchor="middle" fill="#6E6879" font-size="9.8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">:rt =&gt; mean =&gt; :rt_mean（列 =&gt; 関数 =&gt; 新列名）</text>
  <rect x="388" y="24" width="348" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="562" y="48" text-anchor="middle" fill="#2A2733" font-size="12.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">② leftjoin(df, info, on = :id) で属性表を結合</text>
  <rect x="404" y="68" width="144" height="68" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.6"/>
  <text x="476" y="88" text-anchor="middle" fill="#4682B4" font-size="10.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">試行表 df (左表)</text>
  <text x="476" y="108" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P01 | cong   | 512.5</text>
  <text x="476" y="124" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P01 | incong | 560.4</text>
  <rect x="574" y="68" width="144" height="68" rx="7" fill="#FFFFFF" stroke="#D97724" stroke-width="1.6"/>
  <text x="646" y="88" text-anchor="middle" fill="#D97724" font-size="10.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">属性表 info (右表)</text>
  <text x="646" y="108" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P01 | 21 | bilingual</text>
  <text x="646" y="124" text-anchor="middle" fill="#2A2733" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P02 | missing | mono</text>
  <text x="562" y="158" text-anchor="middle" fill="#6D3E86" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ on = :id で照合して右列を付与</text>
  <rect x="404" y="170" width="314" height="68" rx="8" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="561" y="192" text-anchor="middle" fill="#6D3E86" font-size="10.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">id  | cond   | rt    | age(Int64?) | group</text>
  <text x="561" y="212" text-anchor="middle" fill="#2A2733" font-size="10.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P01 | cong   | 512.5 | 21          | bilingual</text>
  <text x="561" y="228" text-anchor="middle" fill="#2A2733" font-size="10.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">P01 | incong | 560.4 | 21          | bilingual</text>
  <text x="562" y="256" text-anchor="middle" fill="#6E6879" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">左表(df)の全試行を残したまま参加者属性がつながる</text>
</svg>
