<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Juliaのエラーメッセージ（例外型・引数型・Stacktraceの自分のファイル行）の読み解き方">
  <title>Juliaのエラーメッセージ（例外型・引数型・Stacktraceの自分のファイル行）の読み解き方</title>
  <rect width="760" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="22" width="712" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="380" y="46" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">エラーの解剖図：全文を暗記せず「①例外名・②渡した型・③自分の行番号」の3か所を見る</text>
  <rect x="42" y="64" width="676" height="44" rx="7" fill="#FBEDEC" stroke="#CB3C33" stroke-width="1.8"/>
  <text x="58" y="91" fill="#CB3C33" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ERROR: MethodError: no method matching +(::String, ::Int64)</text>
  <text x="546" y="91" fill="#2A2733" font-size="10.0" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">← ① 関数 + に String と Int64 を渡した</text>
  <rect x="42" y="122" width="676" height="68" rx="7" fill="#FFFFFF" stroke="#ECE8DF" stroke-width="1.4"/>
  <text x="58" y="144" fill="#6E6879" font-size="10.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Stacktrace: [1] top-level scope</text>
  <rect x="52" y="152" width="656" height="30" rx="5" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.6"/>
  <text x="64" y="172" fill="#2B7A1E" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">   @ Main ~/MyStudy/code/run_analysis.jl:27</text>
  <text x="430" y="172" fill="#2A2733" font-size="10.0" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">← ② 自分が書いたファイル名と行番号を探す</text>
  <rect x="42" y="204" width="216" height="54" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="150" y="226" text-anchor="middle" fill="#4682B4" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">UndefVarError</text>
  <text x="150" y="246" text-anchor="middle" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">綴り・using漏れ・スコープ</text>
  <rect x="272" y="204" width="216" height="54" rx="7" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.5"/>
  <text x="380" y="226" text-anchor="middle" fill="#6D3E86" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">BoundsError / KeyError</text>
  <text x="380" y="246" text-anchor="middle" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">eachindex / get(d,k,missing)</text>
  <rect x="502" y="204" width="216" height="54" rx="7" fill="#FFFFFF" stroke="#D97724" stroke-width="1.5"/>
  <text x="610" y="226" text-anchor="middle" fill="#D97724" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">DimensionMismatch</text>
  <text x="610" y="246" text-anchor="middle" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">size(A), size(B) で次元確認</text>
</svg>
