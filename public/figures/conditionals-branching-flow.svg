<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="if / elseif / else による上から順の条件分岐フローと数直線上の判定境界">
  <title>if / elseif / else による上から順の条件分岐フローと数直線上の判定境界</title>
  <rect width="760" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="22" width="356" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="202" y="46" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">score = 75 の判定フロー（上から順に評価）</text>
  <rect x="44" y="64" width="184" height="42" rx="7" fill="#FFFFFF" stroke="#8A8296" stroke-width="1.5"/>
  <text x="136" y="90" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">if score >= 80</text>
  <text x="246" y="89" fill="#6E6879" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ trueなら "A"</text>
  <text x="136" y="122" text-anchor="middle" fill="#CB3C33" font-size="10.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">↓ false（75は80未満）</text>
  <rect x="44" y="130" width="184" height="44" rx="7" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="2.0"/>
  <text x="136" y="157" text-anchor="middle" fill="#2B7A1E" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">elseif score >= 60</text>
  <rect x="252" y="132" width="110" height="40" rx="7" fill="#2B7A1E" stroke="#2B7A1E" stroke-width="1.5"/>
  <text x="307" y="157" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">true → "B" ✓</text>
  <rect x="44" y="196" width="184" height="38" rx="7" fill="#FFFFFF" stroke="#ECE8DF" stroke-width="1.3"/>
  <text x="136" y="220" text-anchor="middle" fill="#6E6879" font-size="11.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">else → "C"  /  end</text>
  <text x="202" y="256" text-anchor="middle" fill="#2A2733" font-size="10.0" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">最初に true になった枝だけを実行し、end で抜ける</text>
  <rect x="398" y="22" width="338" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="567" y="46" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">数直線で見る境界と「=」vs「==」</text>
  <rect x="420" y="82" width="130" height="36" rx="5" fill="#FBEDEC" stroke="#CB3C33" stroke-width="1.4"/>
  <text x="485" y="105" text-anchor="middle" fill="#CB3C33" font-size="11.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">"C" (60未満)</text>
  <rect x="554" y="82" width="86" height="36" rx="5" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.8"/>
  <text x="597" y="105" text-anchor="middle" fill="#2B7A1E" font-size="11.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">"B" (60..79)</text>
  <rect x="644" y="82" width="72" height="36" rx="5" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.4"/>
  <text x="680" y="105" text-anchor="middle" fill="#6D3E86" font-size="11.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">"A" (80+)</text>
  <circle cx="618" cy="100" r="5" fill="#2B7A1E"/>
  <text x="618" y="74" text-anchor="middle" fill="#2B7A1E" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">score=75</text>
  <rect x="418" y="148" width="298" height="104" rx="8" fill="#FFFFFF" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="434" y="174" fill="#4682B4" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">x = 10   # 代入（箱に10を入れる）</text>
  <text x="434" y="200" fill="#6D3E86" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">x == 10  # 比較（等しいか調べ true/false）</text>
  <text x="434" y="226" fill="#2B7A1E" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">age >= 18 &amp;&amp; age &lt; 65  # かつ (&&)</text>
</svg>
