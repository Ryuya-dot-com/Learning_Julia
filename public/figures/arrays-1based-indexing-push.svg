<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Juliaの1始まり配列インデックス（rt[1]〜rt[end]）とpush!による末尾追加">
  <title>Juliaの1始まり配列インデックス（rt[1]〜rt[end]）とpush!による末尾追加</title>
  <rect width="760" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="24" width="356" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="202" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">番号は 1 から始まる（rt = [512, 498, 634, 402]）</text>
  <text x="74" y="78" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rt[1]</text>
  <rect x="38" y="86" width="72" height="54" rx="7" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="74" y="119" text-anchor="middle" fill="#2A2733" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512</text>
  <text x="156" y="78" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rt[2]</text>
  <rect x="120" y="86" width="72" height="54" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="156" y="119" text-anchor="middle" fill="#2A2733" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">498</text>
  <text x="238" y="78" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rt[3]</text>
  <rect x="202" y="86" width="72" height="54" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="238" y="119" text-anchor="middle" fill="#2A2733" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">634</text>
  <text x="320" y="78" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rt[4]</text>
  <rect x="284" y="86" width="72" height="54" rx="7" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="320" y="119" text-anchor="middle" fill="#2A2733" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">402</text>
  <text x="74" y="160" text-anchor="middle" fill="#6D3E86" font-size="10.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">先頭 rt[1]</text>
  <text x="320" y="160" text-anchor="middle" fill="#6D3E86" font-size="10.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">末尾 rt[end]</text>
  <rect x="42" y="182" width="320" height="68" rx="8" fill="#FFFFFF" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="202" y="206" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">sum(rt) == 2046  /  length(rt) == 4</text>
  <text x="202" y="232" text-anchor="middle" fill="#6E6879" font-size="10.0" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">Rと同じ1始まり（Pythonの0始まりと混同しない）</text>
  <rect x="398" y="24" width="338" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="567" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">push!(rt, 555)：末尾に要素を追加する</text>
  <text x="418" y="80" fill="#6E6879" font-size="10.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">追加前: rt = [512, 498]</text>
  <rect x="418" y="90" width="72" height="44" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.6"/>
  <text x="454" y="117" text-anchor="middle" fill="#2A2733" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512</text>
  <rect x="500" y="90" width="72" height="44" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.6"/>
  <text x="536" y="117" text-anchor="middle" fill="#2A2733" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">498</text>
  <text x="418" y="164" fill="#2B7A1E" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ push!(rt, 555)   # ! は中身を書きかえる目印</text>
  <rect x="418" y="176" width="72" height="48" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="454" y="206" text-anchor="middle" fill="#2A2733" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512</text>
  <rect x="500" y="176" width="72" height="48" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="536" y="206" text-anchor="middle" fill="#2A2733" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">498</text>
  <rect x="582" y="176" width="72" height="48" rx="6" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.8"/>
  <text x="618" y="206" text-anchor="middle" fill="#2A2733" font-size="14" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">555</text>
  <text x="688" y="205" fill="#2B7A1E" font-size="10.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">← 新要素</text>
</svg>
