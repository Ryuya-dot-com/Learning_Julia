  <text x="414" y="98" fill="#2A2733" font-size="9.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">@. y = a * x + b   または   @formula(rt ~ 1 + cond)</text>
  <rect x="402" y="126" width="322" height="56" rx="8" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.7"/>
  <text x="414" y="148" fill="#6D3E86" font-size="10.0" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">② 構文木データ Expr としてマクロが受け取る</text>
  <text x="414" y="168" fill="#2A2733" font-size="9.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ex.head == :(=)  /  ex.args == [:y, :(a * x + b)]</text>
  <rect x="402" y="196" width="322" height="56" rx="8" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.7"/>
  <text x="414" y="218" fill="#2B7A1E" font-size="10.0" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">③ コンパイル前に高速・安全なコードへ書き換え</text>
  <text x="414" y="238" fill="#2A2733" font-size="9.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Broadcast.materialize!(y, broadcasted(+, ...)) → 割当0B!</text>
