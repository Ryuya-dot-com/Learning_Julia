  <text x="570" y="208" text-anchor="middle" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">何百万試行の認知シミュレーションと階層推定</text>
