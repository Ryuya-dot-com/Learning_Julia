<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="変数への代入による計算の流れとJuliaの演算子（小数除算・整数商・余り・べき乗）の比較">
  <title>変数への代入による計算の流れとJuliaの演算子（小数除算・整数商・余り・べき乗）の比較</title>
  <rect width="760" height="300" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="24" width="340" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="194" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">変数の代入（=）と変数どうしの計算</text>
  <rect x="46" y="68" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="109" y="88" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">price = 120</text>
  <text x="109" y="112" text-anchor="middle" fill="#2A2733" font-size="16" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">120</text>
  <rect x="216" y="68" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.8"/>
  <text x="279" y="88" text-anchor="middle" fill="#2B7A1E" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">n = 3</text>
  <text x="279" y="112" text-anchor="middle" fill="#2A2733" font-size="16" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>
  <text x="194" y="103" text-anchor="middle" fill="#6D3E86" font-size="18" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">×</text>
  <line x1="109" y1="126" x2="174" y2="164" stroke="#8A8296" stroke-width="1.6"/>
  <line x1="279" y1="126" x2="214" y2="164" stroke="#8A8296" stroke-width="1.6"/>
  <rect x="74" y="166" width="240" height="62" rx="8" fill="#F3ECF7" stroke="#6D3E86" stroke-width="2.0"/>
  <text x="194" y="188" text-anchor="middle" fill="#6D3E86" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">total = price * n</text>
  <text x="194" y="214" text-anchor="middle" fill="#2A2733" font-size="18" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">360</text>
  <text x="194" y="254" text-anchor="middle" fill="#6E6879" font-size="10.2" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">「=」は右の計算結果を左の箱へ入れる操作</text>
  <rect x="386" y="24" width="350" height="252" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="561" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">Juliaの演算子：/ と ÷ と % と ^ の違い</text>
  <rect x="404" y="70" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.4"/>
  <text x="418" y="94" fill="#4682B4" font-size="12.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">7 / 2  →  3.5</text>
  <text x="545" y="93" fill="#2A2733" font-size="10.2" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">小数のわり算（常にFloat64）</text>
  <rect x="404" y="118" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.4"/>
  <text x="418" y="142" fill="#2B7A1E" font-size="12.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">7 ÷ 2  →  3</text>
  <text x="545" y="141" fill="#2A2733" font-size="10.2" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">整数の商（div(7, 2) と同じ）</text>
  <rect x="404" y="166" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#D97724" stroke-width="1.4"/>
  <text x="418" y="190" fill="#D97724" font-size="12.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">7 % 2  →  1</text>
  <text x="545" y="189" fill="#2A2733" font-size="10.2" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">整数の余り（7 = 2×3 + 1）</text>
  <rect x="404" y="214" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.4"/>
  <text x="418" y="238" fill="#6D3E86" font-size="12.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2 ^ 3  →  8</text>
  <text x="545" y="237" fill="#2A2733" font-size="10.2" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">べき乗（2×2×2、** ではない）</text>
</svg>
