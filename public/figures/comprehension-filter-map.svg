<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="内包表記 [式 for 変数 in 範囲 if 条件] による1行での配列生成と条件抽出">
  <title>内包表記 [式 for 変数 in 範囲 if 条件] による1行での配列生成と条件抽出</title>
  <rect width="760" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="24" width="340" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="194" y="48" text-anchor="middle" fill="#2A2733" font-size="12.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">① 基本形：[x^2 for x in 1:5]</text>
  <rect x="42" y="72" width="52" height="36" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="68" y="95" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>
  <text x="68" y="130" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ x²</text>
  <rect x="42" y="144" width="52" height="40" rx="6" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="68" y="169" text-anchor="middle" fill="#6D3E86" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>
  <rect x="104" y="72" width="52" height="36" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>
  <text x="130" y="130" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ x²</text>
  <rect x="104" y="144" width="52" height="40" rx="6" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="130" y="169" text-anchor="middle" fill="#6D3E86" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4</text>
  <rect x="166" y="72" width="52" height="36" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="192" y="95" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>
  <text x="192" y="130" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ x²</text>
  <rect x="166" y="144" width="52" height="40" rx="6" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="192" y="169" text-anchor="middle" fill="#6D3E86" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">9</text>
  <rect x="228" y="72" width="52" height="36" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="254" y="95" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4</text>
  <text x="254" y="130" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ x²</text>
  <rect x="228" y="144" width="52" height="40" rx="6" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="254" y="169" text-anchor="middle" fill="#6D3E86" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">16</text>
  <rect x="290" y="72" width="52" height="36" rx="6" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.5"/>
  <text x="316" y="95" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">5</text>
  <text x="316" y="130" text-anchor="middle" fill="#6D3E86" font-size="11" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ x²</text>
  <rect x="290" y="144" width="52" height="40" rx="6" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="316" y="169" text-anchor="middle" fill="#6D3E86" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">25</text>
  <text x="194" y="220" text-anchor="middle" fill="#2A2733" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">["s" * string(i) for i in 1:3] → ["s1", "s2", "s3"]</text>
  <text x="194" y="246" text-anchor="middle" fill="#6E6879" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">空配列を作って push! するループを1行で書ける</text>
  <rect x="384" y="24" width="352" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="560" y="48" text-anchor="middle" fill="#2A2733" font-size="12.2" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">② 条件つき：[x for x in rt if x &gt; 520]</text>
  <rect x="404" y="68" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#6E6879" stroke-width="1.5"/>
  <text x="456" y="90" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512.5</text>
  <rect x="524" y="68" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#6E6879" stroke-width="1.5"/>
  <text x="620" y="90" text-anchor="middle" fill="#6E6879" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">false → 除外</text>
  <rect x="404" y="112" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#6E6879" stroke-width="1.5"/>
  <text x="456" y="134" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">498.2</text>
  <rect x="524" y="112" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#6E6879" stroke-width="1.5"/>
  <text x="620" y="134" text-anchor="middle" fill="#6E6879" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">false → 除外</text>
  <rect x="404" y="156" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.5"/>
  <text x="456" y="178" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">550.4</text>
  <rect x="524" y="156" width="192" height="34" rx="6" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.5"/>
  <text x="620" y="178" text-anchor="middle" fill="#2B7A1E" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">true  → 採用 (550.4)</text>
  <rect x="404" y="200" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.5"/>
  <text x="456" y="222" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">601.3</text>
  <rect x="524" y="200" width="192" height="34" rx="6" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.5"/>
  <text x="620" y="222" text-anchor="middle" fill="#2B7A1E" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">true  → 採用 (601.3)</text>
  <text x="560" y="254" text-anchor="middle" fill="#2B7A1E" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">結果: [550.4, 601.3]（語順は for ... if の順）</text>
</svg>
