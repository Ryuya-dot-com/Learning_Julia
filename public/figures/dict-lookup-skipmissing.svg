<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Dict（キーと値の対応表）と欠損値 missing の伝播・skipmissing による除外計算">
  <title>Dict（キーと値の対応表）と欠損値 missing の伝播・skipmissing による除外計算</title>
  <rect width="760" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="24" width="336" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="192" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">① 辞書 Dict：番号ではなく「キー」で引く</text>
  <rect x="46" y="78" width="112" height="42" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="102" y="104" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">"cong"</text>
  <text x="190" y="104" text-anchor="middle" fill="#2A2733" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">=&gt;</text>
  <rect x="220" y="78" width="118" height="42" rx="7" fill="#F3ECF7" stroke="#4682B4" stroke-width="1.8"/>
  <text x="279" y="104" text-anchor="middle" fill="#2A2733" font-size="13" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">"一致"</text>
  <rect x="46" y="138" width="112" height="42" rx="7" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="102" y="164" text-anchor="middle" fill="#6D3E86" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">"incong"</text>
  <text x="190" y="164" text-anchor="middle" fill="#2A2733" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">=&gt;</text>
  <rect x="220" y="138" width="118" height="42" rx="7" fill="#F3ECF7" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="279" y="164" text-anchor="middle" fill="#2A2733" font-size="13" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">"不一致"</text>
  <text x="192" y="216" text-anchor="middle" fill="#6D3E86" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cond_name["incong"]  →  "不一致"</text>
  <text x="192" y="244" text-anchor="middle" fill="#6E6879" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">条件コードから表示ラベルへの変換や設定管理に活躍</text>
  <rect x="380" y="24" width="356" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="558" y="48" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">② x = [500.0, missing, 540.0] の平均計算</text>
  <rect x="398" y="68" width="320" height="52" rx="7" fill="#FFF8EC" stroke="#D97724" stroke-width="1.6"/>
  <text x="412" y="89" fill="#D97724" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mean(x)  →  missing</text>
  <text x="412" y="109" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">欠損が伝染（黙って無視しない）</text>
  <rect x="398" y="132" width="320" height="52" rx="7" fill="#EAF6E6" stroke="#2B7A1E" stroke-width="1.6"/>
  <text x="412" y="153" fill="#2B7A1E" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mean(skipmissing(x))  →  520.0</text>
  <text x="412" y="173" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">✓ 欠損を除いた2件の正しい平均</text>
  <rect x="398" y="196" width="320" height="52" rx="7" fill="#FBEDEC" stroke="#CB3C33" stroke-width="1.6"/>
  <text x="412" y="217" fill="#CB3C33" font-size="11.2" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">誤って missing を 0 に置換  →  346.7</text>
  <text x="412" y="237" fill="#2A2733" font-size="9.8" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">✕ (500+0+540)/3 で平均が大きく歪む!</text>
</svg>
