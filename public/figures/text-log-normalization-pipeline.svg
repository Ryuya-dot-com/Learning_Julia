<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="装置ログ文字列の split・strip・lowercase・tryparse による構造化と欠測・Unicode境界の監査">
  <title>装置ログ文字列の split・strip・lowercase・tryparse による構造化と欠測・Unicode境界の監査</title>
  <rect width="760" height="292" rx="10" fill="#FFFFFF"/>
  <rect x="24" y="22" width="712" height="248" rx="10" fill="#FAF8F4" stroke="#ECE8DF" stroke-width="1.2"/>
  <text x="380" y="46" text-anchor="middle" fill="#2A2733" font-size="12.5" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">原文（raw）を残したまま、split → strip/lowercase → 列数・許容集合検査 → 型変換へ進める</text>
  <rect x="44" y="64" width="672" height="40" rx="7" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.6"/>
  <text x="380" y="89" text-anchor="middle" fill="#4682B4" font-size="12" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">原文 line = " P012 | CONTROL | 512.4 ms "</text>
  <text x="380" y="124" text-anchor="middle" fill="#6D3E86" font-size="10.8" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">↓ strip.(split(line, '|'))  &amp;&amp;  length(parts) == 3 を検査</text>
  <rect x="44" y="136" width="212" height="78" rx="8" fill="#FFFFFF" stroke="#4682B4" stroke-width="1.8"/>
  <text x="150" y="158" text-anchor="middle" fill="#4682B4" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">parts[1] → ID</text>
  <text x="150" y="180" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">"P012"</text>
  <text x="150" y="200" text-anchor="middle" fill="#6E6879" font-size="9.5" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">主キー形式を検査</text>
  <rect x="274" y="136" width="212" height="78" rx="8" fill="#FFFFFF" stroke="#6D3E86" stroke-width="1.8"/>
  <text x="380" y="158" text-anchor="middle" fill="#6D3E86" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">lowercase(parts[2])</text>
  <text x="380" y="180" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">"control"</text>
  <text x="380" y="200" text-anchor="middle" fill="#6E6879" font-size="9.5" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">許可集合 in Set(...) 検査</text>
  <rect x="504" y="136" width="212" height="78" rx="8" fill="#FFFFFF" stroke="#2B7A1E" stroke-width="1.8"/>
  <text x="610" y="158" text-anchor="middle" fill="#2B7A1E" font-size="10.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">replace & parse</text>
  <text x="610" y="180" text-anchor="middle" fill="#2A2733" font-size="11.5" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">512.4 :: Float64</text>
  <text x="610" y="200" text-anchor="middle" fill="#6E6879" font-size="9.5" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">不正値は tryparse で監査</text>
  <text x="380" y="246" text-anchor="middle" fill="#2A2733" font-size="10.0" font-weight="700" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, system-ui, sans-serif">注意：空文字 ""・nothing・missing は別物 / 日本語Unicodeは eachindex・first(s, n) で安全に走査</text>
</svg>
