name: P2 research checks

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜04:17 JST。
    - cron: '17 19 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/p2-*'
      - 'scripts/run-p2-*'
      - 'scripts/run-numeric-checks.jl'
      - 'scripts/setup-validation-env.jl'
      - 'validation/p2-*/**'
      - 'src/research/**'
      - 'e2e-research/**'
      - 'playwright.p2*.config.js'
      - 'vite.config.js'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/p2-research.yml'
  pull_request:
    paths:
      - 'scripts/p2-*'
      - 'scripts/run-p2-*'
      - 'scripts/run-numeric-checks.jl'
      - 'scripts/setup-validation-env.jl'
      - 'validation/p2-*/**'
      - 'src/research/**'
      - 'e2e-research/**'
      - 'playwright.p2*.config.js'
      - 'vite.config.js'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/p2-research.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: p2-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          project: validation/p2-likelihood
      - uses: julia-actions/cache@v3
        with:
          cache-name: p2-research-${{ hashFiles('validation/p2-likelihood/Project.toml', 'validation/p2-likelihood/Manifest.toml') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: validation/p2-scipy/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instantiate P2 likelihood feasibility environment
        run: julia --startup-file=no --project=validation/p2-likelihood scripts/setup-validation-env.jl
      - name: Install SciPy independent reference environment
        run: python -m pip install -r validation/p2-scipy/requirements.txt
      - name: Run P2 numerical research checks
        run: julia --startup-file=no --project=validation/p2-likelihood scripts/run-numeric-checks.jl --p2
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run loopback P2 API browser E2E
        run: npm run test:p2-api
