# main へのpushでWeb契約・Julia数値回帰・Chromium smokeを並列検証し、Pagesへデプロイする。
# 3経路のどれかが落ちたら公開しない。重いPluto実行は別workflowで扱う。
# 事前条件(初回のみ手動): リポジトリ Settings → Pages → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 進行中のデプロイは中断しない(公式Pagesスターターの推奨)。後続runは待機する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  julia-numeric:
    runs-on: ubuntu-latest
    # Fresh runners spend about 14 minutes preparing the three Julia/Python
    # environments before the 32-check suite starts. Keep failure bounds while
    # leaving enough room for the full gate on slower hosted runners.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          project: validation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: validation/p2-scipy/requirements.txt
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-numeric-${{ hashFiles('validation/Project.toml', 'validation/categorical/Project.toml', 'validation/p2-likelihood/Project.toml') }}
      - name: Instantiate validation environment
        run: julia --project=validation scripts/setup-validation-env.jl
      - name: Instantiate categorical-model validation environment
        run: julia --project=validation/categorical scripts/setup-categorical-validation-env.jl
      - name: Instantiate P2 likelihood feasibility environment
        run: julia --startup-file=no --project=validation/p2-likelihood scripts/setup-validation-env.jl
      - name: Install SciPy independent reference environment
        run: python -m pip install -r validation/p2-scipy/requirements.txt
      - name: Run 32 numerical regression checks
        run: julia --project=validation scripts/run-numeric-checks.jl

  browser-smoke:
    runs-on: ubuntu-latest
    # Fresh runners can spend over 20 minutes precompiling the isolated P2
    # environment before Chromium setup and the three browser suites start.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          project: validation/p2-likelihood
      - uses: julia-actions/cache@v3
        with:
          cache-name: p2-browser-${{ hashFiles('validation/p2-likelihood/Project.toml', 'validation/p2-likelihood/Manifest.toml') }}
      - name: Instantiate P2 likelihood feasibility environment for browser E2E
        run: julia --startup-file=no --project=validation/p2-likelihood scripts/setup-validation-env.jl
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production-browser smoke tests
        run: npm run test:e2e
      - name: Run research-only P2 UI smoke tests
        run: npm run test:p2-ui
      - name: Run loopback P2 API browser E2E
        run: npm run test:p2-api

  deploy:
    needs: [build, julia-numeric, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
