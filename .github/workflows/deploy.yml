# main へのpushでWeb契約・Julia数値回帰・Chromium smokeを並列検証し、Pagesへデプロイする。
# 3経路のどれかが落ちたら公開しない。重いPluto実行は別workflowで扱う。
# 事前条件(初回のみ手動): リポジトリ Settings → Pages → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 進行中のデプロイは中断しない(公式Pagesスターターの推奨)。後続runは待機する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  julia-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          project: validation
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-numeric-${{ hashFiles('validation/Project.toml', 'validation/categorical/Project.toml') }}
      - name: Instantiate validation environment
        run: julia --project=validation scripts/setup-validation-env.jl
      - name: Instantiate categorical-model validation environment
        run: julia --project=validation/categorical scripts/setup-categorical-validation-env.jl
      - name: Run 16 numerical regression checks
        run: julia --project=validation scripts/run-numeric-checks.jl

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production-browser smoke tests
        run: npm run test:e2e

  deploy:
    needs: [build, julia-numeric, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
